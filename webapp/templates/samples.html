<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>样品创建 / 批量导入 - 植物病毒分析平台</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="vp-lang" content="{{ lang }}">
<script>try{if(localStorage.getItem("vp_theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
</head>
<body>
{% include "_nav.html" %}

<div class="page">
  <div class="tools-layout group-layout">
    {% include "_group_nav.html" %}
    <main class="group-main">
  <div class="layout">
    <div class="col">
      <div class="card">
        <h1 data-i18n="sc.title">🧾 样品创建 / 批量导入</h1>
        <p class="hint" data-i18n="sc.hint">独立模块：登记样品（样品名 + R1/R2）或按 TSV 批量导入，
        不启动分析。创建后可在本页管理；运行全流程分析请到「自动化分析流程」页选样品。</p>

        <h2 data-i18n="pp.newSample">新建样品</h2>
        <label data-i18n="sc.nameLabel">样品名（留空 = 按文件名自动命名）</label>
        <input id="sample" type="text" data-i18n-ph="sc.namePh" placeholder="留空则自动：Lycium_barbarum_R1.fastq.gz → Lycium_barbarum">
        <label class="req" data-i18n="pp.r1">R1 FASTQ（正向）</label>
        <div class="filerow">
          <input id="r1" type="text" data-i18n-ph="pp.pickPh" placeholder="点击 📁 选择">
          <button class="btn small" onclick="browse('r1')">📁</button>
          <button class="btn small" onclick="pasteSeq('r1', '.fastq')" title="粘贴 FASTQ" data-i18n-title="sc.pasteFastq">📋</button>
        </div>
        <label data-i18n="pp.r2">R2 FASTQ（反向可选，单端留空）</label>
        <div class="filerow">
          <input id="r2" type="text" data-i18n-ph="pp.pickPh" placeholder="点击 📁 选择">
          <button class="btn small" onclick="browse('r2')">📁</button>
          <button class="btn small" onclick="pasteSeq('r2', '.fastq')" title="粘贴 FASTQ" data-i18n-title="sc.pasteFastq">📋</button>
        </div>
        <label data-i18n="sc.projectOptional">项目（可选）</label>
        <input id="s_project" type="text" data-i18n-ph="pp.projectPh" placeholder="如 2026-烟草-课题组">
        <label class="chk"><input type="checkbox" id="subsample_on">
          <span data-i18n="pp.subOn"> 创建时截取子样本（快速验证）</span></label>
        <div id="sub_row" style="display:none">
          <label data-i18n="pp.subPairs">子采样（对）</label>
          <input id="subsample" type="number" value="100000">
        </div>
        <div style="margin-top:10px">
          <button class="btn primary" onclick="scCreate(this)" data-i18n="pp.create">创建样品 →</button>
        </div>
        <div id="cErr" class="err"></div>
      </div>

      <div class="card">
        <h2 data-i18n="pp.batchTitle">📦 批量导入（项目）</h2>
        <p class="hint" style="margin-top:4px" data-i18n="pp.batchHint">每行一条：样品名<TAB>R1 路径<TAB>R2 路径（可空）。
        创建后可勾选加入批处理队列顺序执行（队列在管道页展示）。</p>
        <label data-i18n="pp.batchProject">项目名（可选）</label>
        <input id="batchProject" type="text" data-i18n-ph="pp.projectPh" placeholder="如 2026-烟草-课题组">
        <label data-i18n="pp.batchText">样品列表（TSV：样品名 / R1 / R2）</label>
        <textarea id="batchText" rows="5" style="font-family:var(--mono);font-size:11.5px"
          placeholder="NX-1&#9;fastq/NX-1_R1.fastq.gz&#9;fastq/NX-1_R2.fastq.gz&#10;NX-2&#9;fastq/NX-2_R1.fastq.gz"></textarea>
        <label class="chk"><input type="checkbox" id="batchEnq" checked>
          <span data-i18n="pp.batchEnq"> 创建后加入队列依次运行</span></label>
        <div style="margin-top:10px">
          <button class="btn primary" onclick="scBatch(this)" data-i18n="pp.batchCreate">📦 批量创建样品</button>
        </div>
        <div id="bErr" class="err"></div>
      </div>

      <div class="card">
        <h2><span data-i18n="sc.samplesHeading">样品（</span><span id="scCount">0</span>）</h2>
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
          <select id="projFilter" onchange="scLoadSamples()"
                  style="flex:1;font-size:12px"></select>
        </div>
        <div id="scSamples"><p class="hint" data-i18n="c.loading">加载中…</p></div>
      </div>
    </div>
  </div>
    </main>
  </div>
</div>

<!-- 文件/目录选择对话框 -->
<div id="dlgMask" class="dlgmask" style="display:none">
  <div class="dlg">
    <div class="dlghead"><b data-i18n="c.chooseFile">选择文件</b>
      <button class="btn small" onclick="closeDlg()">✕</button></div>
    <div id="dlgPath" class="dlgpath"></div>
    <div id="dlgList" class="dlglist"></div>
    <div id="dlgPickDir" style="display:none;padding:10px 16px;border-top:1px solid var(--line-100);text-align:right">
      <button class="btn small primary" onclick="pickDir()" data-i18n="c.pickDir">选择此目录 ✔</button>
    </div>
  </div>
</div>

<script src="/static/i18n.js?v={{ asset_v }}"></script>
<script src="/static/app.js?v={{ asset_v }}"></script>
<script>
/* $ / esc / browse / toast / startPolling / loadQueue / queueClear 均来自 app.js */

function val(id) { return ($(id)?.value || '').trim(); }

$('subsample_on')?.addEventListener('change', () => {
  $('sub_row').style.display = $('subsample_on').checked ? '' : 'none';
});

async function scCreate(btn) {
  return withBtn(btn, async () => {
  const errBox = $('cErr');
  errBox.textContent = '';
  if (!val('r1')) { errBox.textContent = t('sc.needR1','请选择 R1 FASTQ 文件'); return; }
  const body = {
    sample: val('sample'), r1: val('r1'), r2: val('r2') || null,
    project: val('s_project') || null,
    subsample: $('subsample_on')?.checked ? (+val('subsample') || 100000) : 0,
  };
  const res = await apiCreateSample(body);
  if (!res.ok) {
    if (res.conn) setConnBanner(true);
    errBox.textContent = res.error; return;
  }
  $('r1').value = ''; $('r2').value = ''; $('sample').value = '';
  toast(t('sc.createSample', '创建样品'), `✔ ${body.sample || t('sc.autoName', '（按 R1 自动命名）')}`, {ttl: 4000});
  scLoadSamples();
  }, t('sc.creating','⏳ 创建中…'));
}

async function scBatch(btn) {
  return withBtn(btn, async () => {
  const errBox = $('bErr');
  errBox.textContent = '';
  const project = val('batchProject');
  const lines = val('batchText').split(/\r?\n/)
    .map(l => l.trim()).filter(l => l && !l.startsWith('#'));
  if (!lines.length) { errBox.textContent = t('pp.needRows','请至少粘贴一行样品信息'); return; }
  const created = [];
  for (const line of lines) {
    const parts = line.split(/\t| {2,}|,/).map(s => s.trim());
    const [sample, r1, r2] = parts;
    if (!sample || !r1) {
      errBox.textContent = t('pp.badRow','格式错误（需要 样品名+R1）') + `: ${line}`; return;
    }
    const res = await apiCreateSample({ sample, r1, r2: r2 || null, project });
    if (!res.ok) {
      if (res.conn) setConnBanner(true);
      errBox.textContent = `${sample}: ${res.error}`;
      return;
    }
    created.push(sample);
  }
  $('batchText').value = '';
  toast(t('sc.batchImport','批量导入'), t('sc.batchCreated','已创建 {n} 个样品').replace('{n}', created.length), {ttl: 4000});
  scLoadSamples();
  if ($('batchEnq')?.checked && created.length) {
    await fetch('/api/queue/add', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ samples: created, project })});
    loadQueue();
  }
  }, t('sc.batching','⏳ 批量创建中…'));
}

async function scDelete(name) {
  if (!confirm(t('sc.delConfirm','删除样品 {name}？（results/ 下该样品目录将移除）').replace('{name}', name))) return;
  try {
    const r = await fetch(`/api/samples/${encodeURIComponent(name)}/delete`,
                          { method: 'POST' });
    if (!r.ok) { alert((await r.json()).error || t('sc.delFail','删除失败')); return; }
    scLoadSamples();
  } catch (e) { alert(t('sc.connFail','无法连接平台服务: ') + e); }
}

async function scLoadSamples() {
  const box = $('scSamples');
  try {
    const list = await (await fetch('/api/samples')).json();
    $('scCount').textContent = list.length;
    if (!list.length) {
      box.innerHTML = '<p class="hint">' + t('c.noSample','暂无样品，先在左侧创建') + '</p>';
      return;
    }
    const sel = $('projFilter');
    const projs = [...new Set(list.map(s => s.project).filter(Boolean))];
    const cur = sel.value;
    sel.innerHTML = `<option value="">${t('pp.allProjects','全部项目')}</option>` +
      projs.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
    if (projs.includes(cur)) sel.value = cur;
    const shown = sel.value ? list.filter(s => s.project === sel.value) : list;
    box.innerHTML = shown.length ? shown.map(s => `
      <div class="sample-item">
        <div class="nm"><span>${esc(s.name)}</span>
          <button class="btn small" style="float:right"
                  onclick="scDelete('${esc(s.name)}')">🗑</button></div>
        ${s.project ? `<div class="hint" style="margin:2px 0 0">🏷 ${esc(s.project)}</div>` : ''}
        <div class="pr">${t('sc.progress','分析进度')} ${s.done}/${s.total}
          <a href="/pipeline" style="margin-left:6px">${t('sc.goRun','去运行分析 →')}</a></div>
      </div>`).join('') : '<p class="hint">' + t('c.noSampleProj','该项目下暂无样品') + '</p>';
  } catch (e) { box.innerHTML = '<p class="hint">' + t('sc.loadFail','加载失败') + '</p>'; }
}

scLoadSamples();
startPolling();
loadQueue();
setInterval(scLoadSamples, 30000);

// 下载页「🧾 样品」发送过来的文件预填（样品名留空，由用户填写或创建时按 R1 自动命名）
(function () {
  const pf = takePrefill('samples');
  if (!pf) return;
  $('r1').value = pf.r1 || '';
  $('r2').value = pf.r2 || '';
  toast(t('hr.prefill','已带入下载文件'), (pf.r1 || '') + (pf.r2 ? ' + ' + pf.r2 : ''), { ttl: 5000 });
})();
</script>
</body>
</html>
