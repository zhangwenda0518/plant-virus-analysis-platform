<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="vp-lang" content="{{ lang }}">
<title>任务中心 - 植物病毒分析平台</title>
<script>try{if(localStorage.getItem("vp_theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
<style>
  .page { max-width: 1060px; margin: 0 auto; padding: 18px 20px 60px; }
  .tk-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .tk-head h1 { margin: 4px 0; font-size: 21px; }
  .tk-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0 4px; }
  .tk-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tk-tabs .tab { border: 1px solid var(--line-200, #dfe6ec); background: var(--surface, #fff);
    border-radius: 99px; padding: 4px 14px; font-size: 12.5px; cursor: pointer; color: var(--ink-600, #456); }
  .tk-tabs .tab:hover { border-color: var(--green-600, #2e8b57); }
  .tk-tabs .tab.on { background: var(--green-700, #1c6b43); border-color: var(--green-700, #1c6b43);
    color: #fff; font-weight: 650; }
  .tk-tabs .tab .cnt { opacity: .75; font-size: 11px; margin-left: 3px; }
  .tk-stats { font-size: 11.5px; color: var(--ink-400, #789); margin: 4px 0 10px; font-family: var(--mono, monospace); }
  .task-card { border: 1px solid var(--line-200, #e5eaef); border-radius: 10px; padding: 10px 14px;
    margin: 8px 0; background: var(--surface, #fff); }
  .task-card.running { border-left: 3px solid var(--amber-500, #e8a13a); }
  .task-card.failed { border-left: 3px solid var(--red-500, #d9534f); }
  .task-card.done { border-left: 3px solid var(--green-500, #3a9d6b); }
  .task-card.cancelled { border-left: 3px solid var(--gray-300, #c4cdd4); }
  .tk-row1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tk-row1 b { font-size: 13.5px; }
  .tk-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .tk-meta { font-size: 11.5px; color: var(--ink-400, #789); margin: 3px 0 0; font-family: var(--mono, monospace); }
  .tk-msg { font-size: 12px; color: var(--ink-600, #456); margin: 3px 0 0; }
  .tk-err { font-size: 12px; color: var(--red-700, #b03a34); background: var(--red-100, #fdecea);
    border-radius: 6px; padding: 4px 8px; margin-top: 5px; }
  .tk-bar { height: 6px; border-radius: 3px; background: var(--gray-100, #edf1f4); margin-top: 7px;
    overflow: hidden; }
  .tk-bar i { display: block; height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--green-600, #2e8b57), var(--green-400, #5bbd8a));
    transition: width .5s; }
  .tk-log-wrap { margin-top: 8px; }
  .tk-log-wrap summary { cursor: pointer; font-size: 12px; color: var(--ink-600, #456); user-select: none;
    list-style: none; }
  .tk-log-wrap summary::before { content: '▸ '; }
  .tk-log-wrap[open] summary::before { content: '▾ '; }
  .tk-log { font-family: Consolas, var(--mono, monospace); font-size: 11px; background: var(--gray-50, #f8f9fa);
    border: 1px solid var(--line-100, #eceff2); border-radius: 6px; padding: 7px 9px; margin-top: 6px;
    max-height: 300px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
  html[data-theme="dark"] .tk-log { background: #1a222a; }
  .tk-empty { color: var(--ink-400, #789); font-size: 12.5px; padding: 18px 0; text-align: center; }
  h2.sec { font-size: 15px; margin: 22px 0 6px; padding-bottom: 5px; border-bottom: 1px solid var(--line-100, #eceff2); }
  .label-chk { display: inline-flex; gap: 5px; align-items: center; font-size: 12.5px; color: var(--ink-600, #456); }
</style>
</head>
<body>
{% include "_nav.html" %}
<div class="page">
  <div class="tk-head">
    <h1 data-i18n="tk.title">任务中心</h1>
    <span class="hint" data-i18n="tk.subtitle">全局任务监测：进度 / 日志 / 停止 / 重启 / 删除</span>
  </div>

  <div class="tk-toolbar">
    <div class="tk-tabs" id="tabs">
      <span class="tab on" data-f="all" data-i18n="tk.f.all">全部</span>
      <span class="tab" data-f="running" data-i18n="tk.f.running">运行中</span>
      <span class="tab" data-f="done" data-i18n="tk.f.done">已完成</span>
      <span class="tab" data-f="failed" data-i18n="tk.f.failed">失败</span>
      <span class="tab" data-f="cancelled" data-i18n="tk.f.cancelled">已停止</span>
    </div>
    <span style="flex:1"></span>
    <label class="label-chk"><input type="checkbox" id="autoChk" checked>
      <span data-i18n="tk.auto">自动刷新</span></label>
    <button class="btn small" onclick="clearFinished()" data-i18n="tk.clear">🧹 清空已完成</button>
    <button class="btn small" onclick="refreshAll(true)" data-i18n="tk.refresh">↻ 刷新</button>
  </div>
  <div class="tk-stats" id="stats"></div>
  <div id="taskList"></div>

  <h2 class="sec"><span data-i18n="tk.arch">历史归档</span> <small class="hint" style="font-weight:400">（服务重启前的任务记录）</small></h2>
  <div id="archList"></div>
</div>

<script src="/static/i18n.js?v={{ asset_v }}"></script>
<script src="/static/app.js?v={{ asset_v }}"></script>
<script>
/* 整个页面脚本包在 IIFE 里：顶层 let/const 不再与 app.js / i18n.js
   的全局声明处在同一词法环境，避免「Identifier already declared」
   导致整块脚本静默不执行；需要给内联 onclick 用的函数显式挂 window。 */
(function () {
'use strict';

/* ═════════ 任务中心：全局任务列表（active + archived） ═════════
   - active：TaskManager 内存任务（可停止/重启/删除/日志）
   - archived：tasks/*.json 归档（重启前历史，仅日志/删除）      */

let FILTER = 'all';
let TASKS = [];          // active 快照
let ARCH = [];           // archived 快照
let ARCH_TOTAL = 0;      // 磁盘归档总数（可能大于 ARCH.length，超 limit 截断）
let pollTimer = null;
let archLoaded = false;  // 归档只在首次/手动/删除后刷新（避免每轮 IO）
const LOG_TAIL = 300;    // 展开日志时拉取的行数

function jf(url, opts) {
  return fetch(url, opts).then(async r => {
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    return d;
  });
}

function fmtClock(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function durOf(task) {
  const end = task.finished || (task.status === 'running' ? Date.now() / 1000 : null);
  return end ? fmtDur(end - task.started) : '';
}

const ST_TEXT = {
  running: ['运行中', 'tstat running'], done: ['已完成', 'tstat done'],
  failed: ['失败', 'tstat failed'], cancelled: ['已停止', 'tstat cancelled'],
};
function stBadge(task) {
  const [txt, cls] = ST_TEXT[task.status] || [task.status, 'tstat'];
  return `<span class="${cls}">${txt}</span>`;
}

function resultLink(task) {
  // 优先任务发起方登记的跳转地址，其次样品报告（href 转义防属性注入）
  if (task.link) return { href: esc(task.link), text: t('tk.goto', '前往页面') };
  if (task.result && task.result.report) return { href: esc(task.result.report), text: t('tk.openReport', '打开报告') };
  return null;
}

const LOG_OPEN = new Set();   // 展开状态的日志卡（重绘后保持）
const cardSigs = {};          // tid -> 状态签名（增量渲染，防日志卡闪烁）

function sigOf(task) {
  return [task.status, task.pct, task.msg, task.stage, task.error, task.eta,
          task.link || '', task.restart ? 1 : 0].join('|');
}

function actionsHtml(task, archived) {
  const btns = [];
  if (!archived && task.status === 'running')
    btns.push(`<button class="btn small danger" onclick="stopTask('${task.id}')">⏹ ${t('tk.stop', '停止')}</button>`);
  if (!archived && task.status !== 'running' && task.restart)
    btns.push(`<button class="btn small" onclick="restartTask('${task.id}')" title="${t('tk.restartTip', '重新提交同一请求')}">↻ ${t('tk.restart', '重启')}</button>`);
  const rl = resultLink(task);
  if (rl && task.status === 'done')
    btns.push(`<a class="btn small" href="${rl.href}" style="text-decoration:none">${rl.text}</a>`);
  btns.push(`<button class="btn small" onclick="delTask('${task.id}', ${archived})">🗑 ${t('tk.del', '删除')}</button>`);
  return `<span class="tk-actions">${btns.join('')}</span>`;
}

function cardHtml(task, archived) {
  const pct = (task.pct != null && task.pct > 0) ? Math.min(100, Math.round(task.pct * 100)) : null;
  const dur = durOf(task);
  const meta = [`${t('tk.started', '开始')} ${fmtClock(task.started)}`];
  if (dur) meta.push(`${t('tk.dur', '耗时')} ${dur}`);
  if (task.eta != null && task.status === 'running') meta.push(`${t('tk.eta', '预计剩余')} ${fmtDur(task.eta)}`);
  const logId = `log-${task.id}`;
  const details = `
    <details class="tk-log-wrap" ${LOG_OPEN.has(task.id) ? 'open' : ''} ontoggle="onLogToggle(this,'${task.id}',${archived})">
      <summary>${t('tk.log', '日志')}</summary>
      <div class="tk-log" id="${logId}">${t('tk.logLoading', '加载中…')}</div>
    </details>`;
  return `<div class="task-card ${task.status}" data-tid="${task.id}">
    <div class="tk-row1">
      ${stBadge(task)}
      <b>${esc(task.name)}</b>
      ${actionsHtml(task, archived)}
    </div>
    ${task.msg ? `<p class="tk-msg">${esc(task.msg)}</p>` : ''}
    ${pct != null ? `<div class="tk-bar"><i style="width:${pct}%"></i></div>` : ''}
    <p class="tk-meta">${meta.join(' · ')}${task.stage ? ' · ' + esc(task.stage) : ''}</p>
    ${task.error ? `<div class="tk-err">${esc(task.error)}</div>` : ''}
    ${details}
  </div>`;
}

function render() {
  const list = document.getElementById('taskList');
  const shown = TASKS.filter(t => FILTER === 'all' ? true : t.status === FILTER);
  if (!shown.length) {
    list.innerHTML = `<div class="tk-empty">${t('tk.empty', '当前过滤条件下暂无任务')}</div>`;
  } else {
    const keep = new Set();
    shown.forEach(tk => {
      const sig = sigOf(tk);
      const tid = tk.id;
      let el = list.querySelector(`[data-tid="${tid}"]`);
      const isStale = !el || cardSigs[tid] !== sig;
      if (isStale) {
        const tmp = document.createElement('div');
        tmp.innerHTML = cardHtml(tk, false);
        const fresh = tmp.firstElementChild;
        if (el) {
          // 重建前转移展开日志内容，消除闪烁
          const oldLog = el.querySelector('.tk-log');
          if (oldLog) {
            const newLog = fresh.querySelector('.tk-log');
            if (newLog && oldLog.textContent && oldLog.textContent !== t('tk.logLoading', '加载中…'))
              newLog.textContent = oldLog.textContent;
          }
          el.replaceWith(fresh);
        } else {
          list.appendChild(fresh);
        }
        el = fresh;
        cardSigs[tid] = sig;
      }
      list.appendChild(el);   // appendChild 移动已有节点 = 保序
      keep.add(tid);
    });
    // 清理消失的卡
    list.querySelectorAll('.task-card').forEach(el => {
      if (!keep.has(el.dataset.tid)) { delete cardSigs[el.dataset.tid]; el.remove(); }
    });
  }
  // 重建后 open 卡手动加载日志（DOM 重建不触发 ontoggle）
  document.querySelectorAll('#taskList .tk-log-wrap[open]').forEach(d => {
    const id = d.querySelector('.tk-log').id.slice(4);
    loadLog(d, id, false);
  });
  const cnt = k => TASKS.filter(x => x.status === k).length;
  document.getElementById('stats').textContent =
    `${t('tk.f.running', '运行中')} ${cnt('running')} · `
    + `${t('tk.f.done', '已完成')} ${cnt('done')} · `
    + `${t('tk.f.failed', '失败')} ${cnt('failed')} · `
    + `${t('tk.f.cancelled', '已停止')} ${cnt('cancelled')}`
    + (archLoaded ? ` · ${t('tk.archCnt', '归档')} ${ARCH.length}`
        + (ARCH_TOTAL > ARCH.length ? `/${ARCH_TOTAL}` : '') : '');
  document.querySelectorAll('#tabs .tab').forEach(el => {
    const f = el.dataset.f;
    const n = f === 'all' ? TASKS.length : cnt(f);
    el.querySelector('.cnt')?.remove();
    if (n) { const s = document.createElement('span'); s.className = 'cnt'; s.textContent = n; el.appendChild(s); }
  });
}

function renderArch() {
  const box = document.getElementById('archList');
  if (!ARCH.length) {
    box.innerHTML = `<div class="tk-empty">${t('tk.noArch', '暂无归档任务')}</div>`;
    return;
  }
  const keep = new Set();
  ARCH.forEach(tk => {
    const sig = sigOf(tk);
    const tid = tk.id;
    const key = 'a:' + tid;
    let el = box.querySelector(`[data-tid="${tid}"]`);
    if (!el || cardSigs[key] !== sig) {
      const tmp = document.createElement('div');
      tmp.innerHTML = cardHtml(tk, true);
      const fresh = tmp.firstElementChild;
      if (el) {
        const oldLog = el.querySelector('.tk-log');
        if (oldLog) {
          const newLog = fresh.querySelector('.tk-log');
          if (newLog && oldLog.textContent && oldLog.textContent !== t('tk.logLoading', '加载中…'))
            newLog.textContent = oldLog.textContent;
        }
        el.replaceWith(fresh);
      } else {
        box.appendChild(fresh);
      }
      el = fresh;
      cardSigs[key] = sig;
    }
    box.appendChild(el);
    keep.add(tid);
  });
  box.querySelectorAll('.task-card').forEach(el => {
    if (!keep.has(el.dataset.tid)) { delete cardSigs['a:' + el.dataset.tid]; el.remove(); }
  });
  // 展开状态的归档日志重填（DOM 重建不触发 ontoggle）
  box.querySelectorAll('.tk-log-wrap[open]').forEach(d => {
    loadLog(d, d.querySelector('.tk-log').id.slice(4), true);
  });
}

/* ── 日志：展开时加载；running 任务展开期间 2s 轮询 ── */
const logTimers = {};
async function loadLog(details, tid, isArchived) {
  const box = document.getElementById('log-' + tid);
  if (!box || !details.open) { clearTimeout(logTimers[tid]); return; }
  try {
    const d = isArchived
      ? await jf(`/api/task/${tid}/log?lines=${LOG_TAIL}`)
      : await jf(`/api/task/${tid}?log_lines=${LOG_TAIL}`);
    const lines = d.log || [];
    const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 24;
    box.textContent = lines.length ? lines.join('\n') : t('c.noLogPar','（暂无日志）');
    if (stick) box.scrollTop = box.scrollHeight;
  } catch (e) {
    box.textContent = '日志加载失败：' + e.message;
  }
  clearTimeout(logTimers[tid]);
  if (!isArchived) {
    const t = TASKS.find(x => x.id === tid);
    if (t && t.status === 'running')
      logTimers[tid] = setTimeout(() => loadLog(details, tid, false), 2000);
  }
}
function onLogToggle(details, tid, archived) {
  if (details.open) { LOG_OPEN.add(tid); loadLog(details, tid, archived); }
  else { LOG_OPEN.delete(tid); clearTimeout(logTimers[tid]); }
}

/* ── 数据拉取与轮询 ── */
async function fetchActive() {
  TASKS = await jf('/api/tasks?logs=0');
  render();
}
async function fetchArch() {
  const d = await jf('/api/tasks?full=1&logs=0');
  ARCH = d.archived || [];
  ARCH_TOTAL = d.archived_total != null ? d.archived_total : ARCH.length;
  archLoaded = true;
  renderArch(); render();
}
async function refreshAll(manual) {
  try { await fetchActive(); } catch (e) { /* 静默 */ }
  if (manual || !archLoaded) { try { await fetchArch(); } catch (e) {} }
  schedule();
}
function schedule() {
  clearTimeout(pollTimer);
  if (document.hidden || !document.getElementById('autoChk').checked) return;
  const running = TASKS.some(t => t.status === 'running');
  pollTimer = setTimeout(refreshAll, running ? 2500 : 10000);
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && document.getElementById('autoChk').checked) refreshAll();
});

/* ── 操作 ── */
async function stopTask(tid) {
  if (!confirm(t('tk.confirmStop', '停止该任务？（已启动的子进程会被终止）'))) return;
  try { await jf(`/api/task/${tid}/cancel`, { method: 'POST' }); } catch (e) { alert(e.message); }
  refreshAll();
}
async function restartTask(tid) {
  const tk = TASKS.find(x => x.id === tid);
  if (!tk || !tk.restart) return;
  if (!confirm(t('tk.confirmRestart', '重新提交此任务？将以相同参数再次发起。'))) return;
  try {
    const d = await jf(tk.restart.url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(tk.restart.body || {}),
    });
    toast(t('tk.restarted', '已重新提交'), d.task || '', { ttl: 4000 });
    refreshAll();
  } catch (e) { alert(t('tk.restartFail', '重启失败') + '：' + e.message); }
}
async function delTask(tid, archived) {
  if (!confirm(archived
    ? t('tk.confirmDelArch', '删除该归档记录？')
    : t('tk.confirmDel', '删除该任务记录？（日志文件保留在 logs/tasks/）'))) return;
  try { await jf(`/api/task/${tid}/delete`, { method: 'POST' }); } catch (e) { alert(e.message); }
  if (archived) { archLoaded = false; await refreshAll(true); }
  else {
    await fetchActive();
    ARCH = ARCH.filter(x => x.id !== tid); renderArch();
  }
}
async function clearFinished() {
  if (!confirm(t('tk.confirmClear', '清空所有已完成 / 失败 / 已停止的任务记录？（运行中不受影响）'))) return;
  try {
    const d = await jf('/api/tasks/clear_finished', { method: 'POST' });
    toast(t('tk.cleaned', '已清理'), t('tk.removedN', '移除 {n} 条任务记录').replace('{n}', d.removed), { ttl: 4000 });
  } catch (e) { alert(e.message); }
  archLoaded = false;
  await refreshAll(true);
}

/* ── 初始化 ── */
document.querySelectorAll('#tabs .tab').forEach(el => {
  el.onclick = () => {
    document.querySelectorAll('#tabs .tab').forEach(x => x.classList.remove('on'));
    el.classList.add('on');
    FILTER = el.dataset.f;
    render();
  };
});
document.getElementById('autoChk').onchange = () => {
  clearTimeout(pollTimer);
  if (document.getElementById('autoChk').checked) schedule();
};
refreshAll(true);

/* 内联 onclick 需要这些函数在全局作用域可见（列表用 HTML 字符串渲染） */
window.stopTask = stopTask;
window.restartTask = restartTask;
window.delTask = delTask;
window.clearFinished = clearFinished;
window.refreshAll = refreshAll;
window.onLogToggle = onLogToggle;

})();
</script>
</body>
</html>
